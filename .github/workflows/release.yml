name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # NO `release-type:` HERE, DELIBERATELY. When that input is set the action
          # takes the `Manifest.fromConfig` branch (src/index.ts: `if (inputs.releaseType)`)
          # and builds the configuration FROM THE INPUTS, never reading
          # release-please-config.json -- so `extra-files`, `bump-minor-pre-major` and
          # every other setting in that file were dead letters while this line existed.
          # Removing it drops the action into `fromManifest`, which loads the config and
          # the manifest by their default names (both match this repo). Caught by
          # CodeRabbit on #102, confirmed in the action's source rather than assumed.
          #
          # Behaviour that CHANGES with this line gone: `bump-minor-pre-major: true`
          # finally takes effect, so a breaking change while still on 0.x bumps the minor
          # instead of jumping to 1.0 -- which is what the config has been asking for.
          token: ${{ secrets.RELEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
